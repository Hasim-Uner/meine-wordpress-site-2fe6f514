<svg class="abb2-svg" viewBox="0 0 900 330" role="img" aria-labelledby="a2-t a2-d" xmlns="http://www.w3.org/2000/svg">
<title id="a2-t">Vorher und nachher: wie viele Besucher an jedem Übergang weiterkommen</title>
<desc id="a2-d">Schematische Darstellung ohne Messwerte. Zwei Bänder von der Suche bis zum Auftrag. An vier Übergängen, von der Seite bis zum Postfach, kommt nachher jeweils ein Fünftel mehr weiter. Am Ende der Kette sind es dadurch rund doppelt so viele Aufträge.</desc>
