name: Retire Blocksy Shell Once

on:
  push:
    branches:
      - refactor/retire-blocksy-shell-2026-09
    paths:
      - '.github/workflows/retire-blocksy-shell-once.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-blocksy-shell-2026-09
      - name: Apply retirement
        run: python3 scripts/retire-blocksy-shell.py
      - name: Verify
        run: |
          python3 scripts/audit-css-architecture.py
          python3 scripts/audit-legacy-nx-css.py
          bash scripts/lint-css-spacing.sh
          bash scripts/lint-css-motion.sh
          node --check blocksy-child/assets/js/nexus-core.js
          ! grep -q 'nexus-flight-mode' blocksy-child/style.css
          ! grep -q '\.ct-panel' blocksy-child/style.css
          ! grep -q 'initHeaderFlight' blocksy-child/assets/js/nexus-core.js
          git diff --check
      - name: Commit source cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocksy-child/style.css blocksy-child/assets/js/nexus-core.js docs/architecture/CSS_ARCHITECTURE.md
          git commit -m 'Retire unreachable Blocksy header shell'
          git push origin HEAD:refactor/retire-blocksy-shell-2026-09
