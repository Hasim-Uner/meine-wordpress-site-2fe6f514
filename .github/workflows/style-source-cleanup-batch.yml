name: Style Source Cleanup Batch

on:
  push:
    branches:
      - refactor/style-source-cleanup-2026-09
    paths:
      - '.github/workflows/style-source-cleanup-batch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/style-source-cleanup-2026-09

      - name: Remove superseded style.css blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style = Path('blocksy-child/style.css')
          text = style.read_text(encoding='utf-8')

          def remove_between(source, start, end, label):
              if source.count(start) != 1 or source.count(end) != 1:
                  raise SystemExit(f'{label}: marker drift start={source.count(start)} end={source.count(end)}')
              a = source.index(start)
              b = source.index(end, a)
              if b <= a:
                  raise SystemExit(f'{label}: invalid marker order')
              removed = source[a:b]
              return source[:a] + source[b:], removed

          removals = [
              ('/* Menü-Links: Clean & Spaced */', '/* --- Homepage Optimization: Hero Stack + Section Order --- */', 'retired Blocksy menu and header CTA'),
              ('@media (min-width: 1024px) {\n/* --- 2. NEXUS MEGA MENÜ (VIEWPORT FIX) --- */', '/* --- 3. INLINE-PFEIL --- */', 'retired Blocksy mega menu'),
              ('/* --- NEXUS SINGLE PAGE LAYOUT --- */', '/* --- NEXUS ARCHIVE LAYOUT --- */', 'superseded single-post base'),
              ('/* --- NEXUS FEINSCHLIFF: LESEZEIT & SHARING --- */', '/* --- NEXUS CLIENT PORTAL --- */', 'superseded single-post share finishing'),
          ]

          removed_total = ''
          for start, end, label in removals:
              text, removed = remove_between(text, start, end, label)
              removed_total += removed
              print(f'Removed {label}: {removed.count(chr(10)) + 1} lines')

          for fragment in ('.ct-header .ct-menu > li > a', 'NEXUS MEGA MENÜ (VIEWPORT FIX)', '.nexus-single-container', '.nexus-share-box'):
              if fragment not in removed_total:
                  raise SystemExit(f'style.css: expected cleanup fragment was not removed: {fragment}')

          for marker in ('/* Menü-Links: Clean & Spaced */', 'NEXUS MEGA MENÜ (VIEWPORT FIX)', 'NEXUS SINGLE PAGE LAYOUT', 'NEXUS FEINSCHLIFF: LESEZEIT & SHARING'):
              if marker in text:
                  raise SystemExit(f'style.css: retired block marker remains: {marker}')

          for marker in ('NEXUS ARCHIVE LAYOUT', 'NEXUS CLIENT PORTAL', 'LEGAL PAGE MODAL', 'Homepage Optimization: Hero Stack + Section Order'):
              if marker not in text:
                  raise SystemExit(f'style.css: live marker was lost: {marker}')

          single = Path('blocksy-child/assets/css/single.css').read_text(encoding='utf-8')
          for selector in ('.nexus-single-container', '.nexus-article-hero', '.nexus-meta-top', '.nexus-title', '.nexus-hero-footer', '.nexus-share-box', '.nexus-share-btn'):
              if selector not in single:
                  raise SystemExit(f'single.css no longer owns required selector: {selector}')
          style.write_text(text, encoding='utf-8')

          build = Path('scripts/build-theme-dist.sh')
          text = build.read_text(encoding='utf-8')
          text = text.replace('single_css="$sst_css_dir/single.css"\n', '')
          start = '# The source still carries one historical single-post base block in style.css.\n'
          end = 'if [ -f "$style_file" ]; then\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('build-theme-dist.sh: single-prune block markers drifted')
          a = text.index(start)
          b = text.index(end, a)
          text = text[:a] + text[b:]
          if 'prune-style-single-legacy.py' in text:
              raise SystemExit('build-theme-dist.sh still references retired single pruner')
          build.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/css-architecture.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace("      - 'scripts/prune-style-single-legacy.py'\n", '')
          step = '''      - name: Verify deployment single-style prune\n        run: |\n          cp blocksy-child/style.css /tmp/blocksy-child-style.css\n          python3 scripts/prune-style-single-legacy.py \\\n            /tmp/blocksy-child-style.css \\\n            blocksy-child/assets/css/single.css\n          if grep -q 'NEXUS SINGLE PAGE LAYOUT' /tmp/blocksy-child-style.css; then\n            echo 'Superseded single-post block is still present after prune.' >&2\n            exit 1\n          fi\n          grep -q 'NEXUS ARCHIVE LAYOUT' /tmp/blocksy-child-style.css\n'''
          if text.count(step) != 1:
              raise SystemExit('css-architecture.yml: retired prune verification step drifted')
          workflow.write_text(text.replace(step, '').rstrip() + '\n', encoding='utf-8')

          doc = Path('docs/architecture/CSS_ARCHITECTURE.md')
          text = doc.read_text(encoding='utf-8')
          start = '### Deployment-Deduplizierung von `style.css`\n'
          end = '## 4. Bewusste lokale Systeme\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('CSS_ARCHITECTURE.md: style cleanup section markers drifted')
          a = text.index(start)
          b = text.index(end, a)
          replacement = '''### Source-Bereinigung von `style.css`\n\nDer historische `NEXUS SINGLE PAGE LAYOUT`-Block und sein altes Share-Finishing sind jetzt auch aus dem Authoring-Source entfernt. `assets/css/single.css` besitzt die produktiven Single-/SEO-Cornerstone-Selektoren vollständig; der frühere Deployment-Pruner ist deshalb entfallen.\n\nZusätzlich wurden die serverseitig nicht mehr renderbaren Blocksy-Menü-/CTA- und Mega-Menü-Blöcke aus `style.css` entfernt. Der Parent-Header ist über `blocksy:builder:header:enabled` deaktiviert; die aktuelle Standardnavigation wird als `.leiste` gerendert. Andere historische `.ct-header`-/`.ct-panel`-Regeln bleiben bewusst als separater Migrationsbestand bestehen und werden nicht durch einen pauschalen Selector-Guard mit diesem Schnitt vermischt. Archive- und Kundenportal-Blöcke bleiben ebenfalls bestehen, bis sie separat migriert oder ausgelagert sind.\n\n'''
          doc.write_text(text[:a] + replacement + text[b:], encoding='utf-8')
          PY

          git rm scripts/prune-style-single-legacy.py

      - name: Verify cleanup
        run: |
          python3 scripts/audit-css-architecture.py
          python3 scripts/audit-legacy-nx-css.py
          bash scripts/lint-css-spacing.sh
          bash scripts/lint-css-motion.sh
          bash -n scripts/build-theme-dist.sh
          grep -q 'NEXUS ARCHIVE LAYOUT' blocksy-child/style.css
          grep -q 'NEXUS CLIENT PORTAL' blocksy-child/style.css
          if grep -q 'NEXUS SINGLE PAGE LAYOUT' blocksy-child/style.css; then
            echo 'Superseded single block still exists in source.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove superseded global style source blocks'
          git push origin HEAD:refactor/style-source-cleanup-2026-09
