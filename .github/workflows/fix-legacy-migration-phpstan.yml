name: Fix Legacy Migration PHPStan

on:
  push:
    branches:
      - fix/legacy-internal-links

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-internal-links
      - name: Replace unstubbed WordPress constant with literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('blocksy-child/inc/legacy-internal-link-migration.php')
          text = path.read_text()
          old = "get_page_by_path( (string) $slug, OBJECT, 'post' );"
          new = "get_page_by_path( (string) $slug, 'OBJECT', 'post' );"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected get_page_by_path call not found')
          PY
          php -l blocksy-child/inc/legacy-internal-link-migration.php
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "Hasim-hannover"
          git config user.email "hasimuener@gmail.com"
          git add blocksy-child/inc/legacy-internal-link-migration.php
          git commit -m "Fix legacy migration PHPStan constant"
          git push origin HEAD:fix/legacy-internal-links
