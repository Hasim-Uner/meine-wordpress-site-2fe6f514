name: Cleanup Legacy Link Migration

on:
  push:
    branches:
      - cleanup/remove-legacy-link-migration

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-link-migration
      - name: Remove completed migration module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          functions = Path('blocksy-child/functions.php')
          text = functions.read_text()
          line = "\t'legacy-internal-link-migration.php', // Einmalige Bereinigung alter interner Links in editor-owned Blogposts\n"
          if line in text:
              functions.write_text(text.replace(line, '', 1))
          elif "legacy-internal-link-migration.php" in text:
              raise SystemExit('migration include found in unexpected form')
          migration = Path('blocksy-child/inc/legacy-internal-link-migration.php')
          if migration.exists():
              migration.unlink()
          PY
          php -l blocksy-child/functions.php
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "Hasim-hannover"
          git config user.email "hasimuener@gmail.com"
          git add -A blocksy-child/functions.php blocksy-child/inc/legacy-internal-link-migration.php
          git commit -m "Remove completed legacy link migration"
          git push origin HEAD:cleanup/remove-legacy-link-migration
