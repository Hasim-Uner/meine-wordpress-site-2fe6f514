name: One-time SEO Cockpit link graph fix

on:
  push:
    branches:
      - fix/seo-cockpit-link-graph
    paths:
      - .github/workflows/one-time-seo-cockpit-link-graph-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/seo-cockpit-link-graph
          fetch-depth: 0

      - name: Align SEO Cockpit link graph with live templates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('blocksy-child/inc/seo-cockpit/seo-cockpit-links.php')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          """\tif ( 'page-hasim-uener.php' === $template || 'hasim-uener' === $post_slug ) {
          \t\t$links = array_merge(
          \t\t\t$links,
          \t\t\t[
          \t\t\t\t$primary_urls['audit'] ?? home_url( '/solar-waermepumpen-leadgenerierung/#marktcheck' ),
          \t\t\t\t$contact_url,
          \t\t\t]
          \t\t);
          \t}
          """,
          """\tif ( 'page-hasim-uener.php' === $template || 'hasim-uener' === $post_slug ) {
          \t\t$links = array_merge(
          \t\t\t$links,
          \t\t\t[
          \t\t\t\t$primary_urls['e3'] ?? home_url( '/case-study-solar-leadgenerierung/' ),
          \t\t\t\tfunction_exists( 'hu_get_commercial_route' )
          \t\t\t\t\t? hu_get_commercial_route( 'freelancer', home_url( '/wordpress-freelancer-hannover/' ) )
          \t\t\t\t\t: home_url( '/wordpress-freelancer-hannover/' ),
          \t\t\t\t$contact_url,
          \t\t\t\tfunction_exists( 'nexus_get_whitelabel_page_url' )
          \t\t\t\t\t? nexus_get_whitelabel_page_url()
          \t\t\t\t\t: home_url( '/whitelabel-retainer/' ),
          \t\t\t]
          \t\t);
          \t}
          """,
          'about template links',
          )

          old_vars = """\t$primary_urls     = function_exists( 'nexus_get_primary_public_url_map' ) ? nexus_get_primary_public_url_map() : [];
          \t$home_url         = $primary_urls['home'] ?? home_url( '/' );
          \t$blog_url         = $primary_urls['blog'] ?? home_url( '/blog/' );
          \t$audit_url        = $primary_urls['audit'] ?? home_url( '/solar-waermepumpen-leadgenerierung/#marktcheck' );
          \t$cases_url        = $primary_urls['results'] ?? home_url( '/ergebnisse/' );
          \t$agentur_url      = $primary_urls['agentur'] ?? home_url( '/wordpress-agentur-hannover/' );
          \t$wartung_url      = $primary_urls['wartung'] ?? home_url( '/wordpress-agentur-hannover/#wordpress-wartung' );
          \t$wgos_url         = $primary_urls['wgos'] ?? home_url( '/wordpress-agentur-hannover/#methode' );
          \t$e3_url           = $primary_urls['e3'] ?? home_url( '/case-study-solar-leadgenerierung/' );
          \t$domdar_url       = $primary_urls['domdar'] ?? home_url( '/case-study-domdar/' );
          \t$whitelabel_url   = $primary_urls['whitelabel'] ?? home_url( '/whitelabel-retainer/' );
          \t$seo_url          = $primary_urls['seo'] ?? home_url( '/wordpress-agentur-hannover/#technisches-seo' );
          \t$cwv_url          = $primary_urls['cwv'] ?? home_url( '/wgos-assets/cwv-optimierung/' );
          \t$tracking_url     = $primary_urls['tracking'] ?? home_url( '/ga4-tracking-setup/' );
          \t$tools_url        = $primary_urls['tools'] ?? home_url( '/solar-waermepumpen-leadgenerierung/#marktcheck' );
          \t$about_url        = $primary_urls['about'] ?? home_url( '/hasim-uener/' );
          \t$contact_url      = $primary_urls['contact'] ?? home_url( '/kontakt/' );
          \t$implementation_url = add_query_arg(
          \t\t[
          \t\t\t'type' => 'implementation',
          \t\t],
          \t\t$contact_url
          \t);
          \t$imprint_url     = $primary_urls['impressum'] ?? home_url( '/impressum/' );
          \t$privacy_url     = $primary_urls['datenschutz'] ?? home_url( '/datenschutz/' );
          \t$primary_links   = nexus_get_seo_cockpit_primary_menu_links();
          """

          new_vars = """\t$primary_urls   = function_exists( 'nexus_get_primary_public_url_map' ) ? nexus_get_primary_public_url_map() : [];
          \t$routes         = function_exists( 'hu_get_commercial_route_map' ) ? hu_get_commercial_route_map() : [];
          \t$home_url       = $primary_urls['home'] ?? home_url( '/' );
          \t$blog_url       = $primary_urls['blog'] ?? home_url( '/blog/' );
          \t$audit_url      = $primary_urls['audit'] ?? home_url( '/solar-waermepumpen-leadgenerierung/#marktcheck' );
          \t$cases_url      = $primary_urls['results'] ?? home_url( '/ergebnisse/' );
          \t$wgos_url       = $primary_urls['wgos'] ?? home_url( '/wordpress-agentur-hannover/#methode' );
          \t$e3_url         = $primary_urls['e3'] ?? home_url( '/case-study-solar-leadgenerierung/' );
          \t$energy_url     = $routes['energy'] ?? ( $primary_urls['energy'] ?? home_url( '/solar-waermepumpen-leadgenerierung/' ) );
          \t$freelancer_url = $routes['freelancer'] ?? ( $primary_urls['freelancer'] ?? home_url( '/wordpress-freelancer-hannover/' ) );
          \t$whitelabel_url = $routes['whitelabel'] ?? ( $primary_urls['whitelabel'] ?? home_url( '/whitelabel-retainer/' ) );
          \t$about_url      = $routes['about'] ?? ( $primary_urls['about'] ?? home_url( '/hasim-uener/' ) );
          \t$contact_url    = $routes['contact'] ?? ( $primary_urls['contact'] ?? home_url( '/kontakt/' ) );
          \t$glossary_url   = $primary_urls['glossary'] ?? home_url( '/glossar/' );
          \t$imprint_url    = $primary_urls['impressum'] ?? home_url( '/impressum/' );
          \t$privacy_url    = $primary_urls['datenschutz'] ?? home_url( '/datenschutz/' );
          \t$primary_links  = nexus_get_seo_cockpit_primary_menu_links();
          """
          replace_once(old_vars, new_vars, 'sitewide URL variables')

          replace_once(
          """\t\t'blog_header' => [
          \t\t\t'key'   => 'blog_header',
          \t\t\t'label' => 'Blog-Header',
          \t\t\t'links' => [
          \t\t\t\t$home_url,
          \t\t\t\t$wgos_url,
          \t\t\t\t$cases_url,
          \t\t\t\t$about_url,
          \t\t\t\t$audit_url,
          \t\t\t],
          \t\t],
          """,
          """\t\t'blog_header' => [
          \t\t\t'key'   => 'blog_header',
          \t\t\t'label' => 'Blog-Header',
          \t\t\t'links' => [
          \t\t\t\t$home_url,
          \t\t\t\t$blog_url,
          \t\t\t\t$energy_url,
          \t\t\t\t$freelancer_url,
          \t\t\t\t$whitelabel_url,
          \t\t\t\t$cases_url,
          \t\t\t\t$about_url,
          \t\t\t\t$contact_url,
          \t\t\t],
          \t\t],
          """,
          'blog header links',
          )

          replace_once(
          """\t\t'site_footer' => [
          \t\t\t'key'   => 'site_footer',
          \t\t\t'label' => 'Footer',
          \t\t\t'links' => [
          \t\t\t\t$home_url,
          \t\t\t\t$audit_url,
          \t\t\t\t$privacy_url,
          \t\t\t\t$audit_url,
          \t\t\t\t$agentur_url,
          \t\t\t\t$wartung_url,
          \t\t\t\t$wgos_url,
          \t\t\t\t$cases_url,
          \t\t\t\t$e3_url,
          \t\t\t\t$domdar_url,
          \t\t\t\t$whitelabel_url,
          \t\t\t\t$blog_url,
          \t\t\t\t$seo_url,
          \t\t\t\t$cwv_url,
          \t\t\t\t$tracking_url,
          \t\t\t\t$tools_url,
          \t\t\t\t$implementation_url,
          \t\t\t\t$about_url,
          \t\t\t\t$contact_url,
          \t\t\t\t$imprint_url,
          \t\t\t\t$privacy_url,
          \t\t\t],
          \t\t],
          """,
          """\t\t'site_footer' => [
          \t\t\t'key'   => 'site_footer',
          \t\t\t'label' => 'Footer',
          \t\t\t'links' => [
          \t\t\t\t$whitelabel_url,
          \t\t\t\t$energy_url,
          \t\t\t\t$freelancer_url,
          \t\t\t\t$contact_url,
          \t\t\t\t$about_url,
          \t\t\t\t$e3_url,
          \t\t\t\t$blog_url,
          \t\t\t\t$glossary_url,
          \t\t\t\t$imprint_url,
          \t\t\t\t$privacy_url,
          \t\t\t],
          \t\t],
          \t\t'freelancer_footer' => [
          \t\t\t'key'   => 'freelancer_footer',
          \t\t\t'label' => 'Footer (Freelancer)',
          \t\t\t'links' => [
          \t\t\t\t$about_url,
          \t\t\t\t$e3_url,
          \t\t\t\t$blog_url,
          \t\t\t\t$glossary_url,
          \t\t\t\t$imprint_url,
          \t\t\t\t$privacy_url,
          \t\t\t],
          \t\t],
          """,
          'footer links',
          )

          replace_once(
          """\t\t'default' => [
          \t\t\t'key'         => 'default',
          \t\t\t'label'       => 'Standard-Shell',
          \t\t\t'source_keys' => [ 'site_header', 'site_footer' ],
          \t\t],
          \t\t'blog'    => [
          """,
          """\t\t'default' => [
          \t\t\t'key'         => 'default',
          \t\t\t'label'       => 'Standard-Shell',
          \t\t\t'source_keys' => [ 'site_header', 'site_footer' ],
          \t\t],
          \t\t'freelancer' => [
          \t\t\t'key'         => 'freelancer',
          \t\t\t'label'       => 'Freelancer-Shell',
          \t\t\t'source_keys' => [ 'site_header', 'freelancer_footer' ],
          \t\t],
          \t\t'blog'    => [
          """,
          'freelancer shell definition',
          )

          replace_once(
          """\tif ( $audit && $audit === $url ) {
          \t\treturn 'audit';
          \t}

          \tif ( $audit_path === $path ) {
          \t\treturn 'audit';
          \t}

          \tif (
          """,
          """\tif ( $audit && $audit === $url ) {
          \t\treturn 'audit';
          \t}

          \tif ( $audit_path === $path ) {
          \t\treturn 'audit';
          \t}

          \tif ( '/wordpress-freelancer-hannover/' === $path ) {
          \t\treturn 'freelancer';
          \t}

          \tif (
          """,
          'freelancer shell detection',
          )

          replace_once("'sitewide_v5'", "'sitewide_v6'", 'link graph cache version')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP syntax
        run: php -l blocksy-child/inc/seo-cockpit/seo-cockpit-links.php

      - name: Verify expected diff
        shell: bash
        run: |
          grep -q "'sitewide_v6'" blocksy-child/inc/seo-cockpit/seo-cockpit-links.php
          grep -q "'freelancer_footer'" blocksy-child/inc/seo-cockpit/seo-cockpit-links.php
          grep -q "\$freelancer_url" blocksy-child/inc/seo-cockpit/seo-cockpit-links.php
          git diff --check
          git diff -- blocksy-child/inc/seo-cockpit/seo-cockpit-links.php

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Hasim-hannover"
          git config user.email "hasimuener@gmail.com"
          git rm .github/workflows/one-time-seo-cockpit-link-graph-fix.yml
          git add blocksy-child/inc/seo-cockpit/seo-cockpit-links.php
          git commit -m "fix: align SEO cockpit link graph with live templates"
          git push origin HEAD:fix/seo-cockpit-link-graph
