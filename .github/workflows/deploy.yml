name: Deploy Theme (Production)

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      automatic:
        description: Guard automatic deployments against newer runtime revisions
        required: false
        default: false
        type: boolean
      ref:
        description: Git ref to deploy
        required: false
        default: main
        type: string
      dry_run:
        description: Preview rsync changes without writing to the server
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main
        type: string
      dry_run:
        description: Preview rsync changes without writing to the server
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  DEPLOY_HOST: ${{ vars.SSH_HOST != '' && vars.SSH_HOST || secrets.SSH_HOST }}
  DEPLOY_USER: ${{ vars.SSH_USER != '' && vars.SSH_USER || secrets.SSH_USER }}
  SSH_PORT: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || 'www/wp-content/themes/blocksy-child/' }}
  BUILD_OUTPUT_DIR: .build/blocksy-child

jobs:
  revision:
    # Runs inside the production-deploy concurrency group, before any upload.
    # Manual releases/rollbacks retain their explicitly selected ref.
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.revision.outputs.current }}
      deploy: ${{ github.event_name != 'push' || steps.plan.outputs.deploy == 'true' }}
    steps:
      - name: Checkout automatic deployment ref
        if: github.event_name == 'push' || inputs.automatic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          fetch-depth: 0

      - name: Verify production revision came through a merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pulls="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")"
          if ! jq -e '[.[] | select(.merged_at != null and .base.ref == "main")] | length > 0' <<<"$pulls" >/dev/null; then
            echo "::error title=Unreviewed production revision::Main revision ${RELEASE_SHA} is not associated with a merged pull request targeting main."
            exit 1
          fi

      - name: Select whether this revision needs deployment
        if: github.event_name == 'push'
        id: plan
        env:
          CHECK_BASE: ${{ github.event.before }}
          CHECK_HEAD: ${{ github.sha }}
        run: python3 scripts/check.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Verify automatic revision is still current
        id: revision
        env:
          AUTOMATIC: ${{ github.event_name == 'push' || inputs.automatic }}
        shell: bash
        run: |
          if [[ "$AUTOMATIC" == 'true' ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            python3 scripts/check.py --deployment-current --github-output "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

  phpstan-cache:
    # pull_request caches are scoped to refs/pull/*/merge. Refresh a trusted
    # default-branch cache after each reviewed merge so the next PR can reuse it.
    needs: revision
    if: github.event_name == 'push' && needs.revision.outputs.current == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout merged main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read pinned toolchain
        id: toolchain
        run: python3 scripts/toolchain.py versions --github-output "$GITHUB_OUTPUT"

      - name: Cache exact PHP and Composer
        id: php-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/toolchain/php
            .build/toolchain/composer
          key: php-cli-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}

      - name: Install PHP build prerequisites
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libxml2-dev libcurl4-openssl-dev zlib1g-dev unzip xz-utils

      - name: Set up exact PHP and Composer
        run: python3 scripts/toolchain.py install-php --github-path "$GITHUB_PATH"

      - name: Install PHP analysis tooling
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer install --no-interaction --no-progress --prefer-dist; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Composer install failed after 3 attempts." >&2
              exit 1
            fi
            delay=$(( attempt * 5 ))
            echo "::warning::Composer install failed on attempt ${attempt}; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Restore PHPStan result cache
        id: phpstan-cache
        uses: actions/cache/restore@v5
        with:
          path: .build/phpstan
          key: phpstan-result-v1-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.php }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-baseline.neon', 'stubs/**/*.php') }}-${{ github.run_id }}
          restore-keys: |
            phpstan-result-v1-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.php }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-baseline.neon', 'stubs/**/*.php') }}-

      - name: Refresh PHPStan result cache on main
        run: php vendor/phpstan/phpstan/phpstan.phar analyse --no-progress --memory-limit=4G

      - name: Save PHPStan result cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .build/phpstan
          key: ${{ steps.phpstan-cache.outputs.cache-primary-key }}


  deploy:
    needs: revision
    if: needs.revision.outputs.current == 'true' && needs.revision.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}

      - name: Read pinned toolchain
        id: toolchain
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          toolchain_root="$GITHUB_WORKSPACE"
          if [[ ! -f .toolchain.json ]]; then
            # Rollbacks to commits predating the manifest use this workflow's pins.
            git fetch --no-tags origin "$WORKFLOW_SHA"
            toolchain_root="$RUNNER_TEMP/deploy-toolchain"
            mkdir -p "$toolchain_root/scripts"
            git show "$WORKFLOW_SHA:.toolchain.json" > "$toolchain_root/.toolchain.json"
            git show "$WORKFLOW_SHA:scripts/toolchain.py" > "$toolchain_root/scripts/toolchain.py"
          fi
          python3 "$toolchain_root/scripts/toolchain.py" versions --github-output "$GITHUB_OUTPUT"
          printf 'installer=%s\n' "$toolchain_root/scripts/toolchain.py" >> "$GITHUB_OUTPUT"

      - name: Cache exact PHP and Composer
        id: php-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/toolchain/php
            .build/toolchain/composer
          key: php-cli-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}

      - name: Install PHP build prerequisites
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libxml2-dev libcurl4-openssl-dev zlib1g-dev unzip xz-utils

      - name: Set up exact PHP and Composer
        env:
          TOOLCHAIN_INSTALLER: ${{ steps.toolchain.outputs.installer }}
        run: python3 "$TOOLCHAIN_INSTALLER" install-php --prefix "$GITHUB_WORKSPACE/.build/toolchain" --github-path "$GITHUB_PATH"

      - name: Validate deploy config
        run: bash scripts/verify-deploy-config.sh "$SSH_PORT" "$DEPLOY_PATH"

      - name: Normalize deploy path
        run: |
          deploy_path="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r')"
          deploy_path="$(printf '%s' "$deploy_path" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          deploy_path="${deploy_path#\"}"
          deploy_path="${deploy_path%\"}"
          deploy_path="${deploy_path#\'}"
          deploy_path="${deploy_path%\'}"
          printf 'DEPLOY_PATH_NORMALIZED=%s\n' "$deploy_path" >> "$GITHUB_ENV"

          public_root=""
          case "$deploy_path" in
            *wp-content/themes/blocksy-child/)
              public_root="${deploy_path%wp-content/themes/blocksy-child/}"
              ;;
          esac
          printf 'PUBLIC_ROOT_NORMALIZED=%s\n' "$public_root" >> "$GITHUB_ENV"

      - name: Check required deploy credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_PRIVATE_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deploy setting::$name is required for deployment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: PHP syntax check
        run: find blocksy-child -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: 'npm'

      - name: Verify build tool versions
        env:
          PINNED_PHP: ${{ steps.toolchain.outputs.php }}
          PINNED_NODE: ${{ steps.toolchain.outputs.node }}
          PINNED_NPM: ${{ steps.toolchain.outputs.npm }}
        run: |
          test "$(php -r 'echo PHP_VERSION;')" = "$PINNED_PHP"
          test "$(node -p 'process.versions.node')" = "$PINNED_NODE"
          test "$(npm --version)" = "$PINNED_NPM"

      - name: Install Node build tooling
        run: npm ci

      - name: Build theme distribution
        run: npm run build:theme -- "$BUILD_OUTPUT_DIR"

      - name: Stamp theme deployment
        run: git rev-parse HEAD > "$BUILD_OUTPUT_DIR/.nexus-deploy-sha"

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connectivity and target path
        run: |
          safe_deploy_path=${DEPLOY_PATH_NORMALIZED//\'/\'\\\'\'}
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$safe_deploy_path' && test -d '$safe_deploy_path'"

      - name: Preview rsync changes
        if: ${{ inputs.dry_run }}
        run: |
          rsync -azvn --delete-delay --itemize-changes --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            "$BUILD_OUTPUT_DIR/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH_NORMALIZED"

      - name: Deploy via rsync over SSH
        if: ${{ !inputs.dry_run }}
        run: |
          rsync -az --delete-delay --itemize-changes --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            "$BUILD_OUTPUT_DIR/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH_NORMALIZED"

      - name: Deploy static llms.txt at web root
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${PUBLIC_ROOT_NORMALIZED:-}" ]; then
            echo "::warning title=llms.txt not copied::Could not derive the public web root from DEPLOY_PATH; the WordPress fallback route remains active."
            exit 0
          fi

          safe_public_root=${PUBLIC_ROOT_NORMALIZED//\'/\'\\\'\'}
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$safe_public_root'"

          rsync -az --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            llms.txt \
            "$DEPLOY_USER@$DEPLOY_HOST:${PUBLIC_ROOT_NORMALIZED}llms.txt"

      - name: Live smoke test
        if: ${{ !inputs.dry_run }}
        run: |
          # Rsync writes directly into the active theme. A short grace period is
          # enough; the smoke script handles transient network errors itself.
          sleep 5
          base_url="${SMOKE_BASE_URL:-https://hasimuener.de}"
          bash scripts/smoke-live.sh "$base_url"

          # Agentic Browsing fetches /llms.txt outside WordPress. Keep this
          # endpoint tiny, static and independently testable so a slow WP
          # bootstrap cannot turn an otherwise healthy site into an agentic
          # timeout.
          llms_body="$(curl -fsS --connect-timeout 4 --max-time 8 "${base_url%/}/llms.txt")"
          grep -Fq '# Haşim Üner' <<< "$llms_body" || {
            echo "::error title=llms.txt smoke failed::Root llms.txt is missing or has unexpected content."
            exit 1
          }
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_CONNECT_TIMEOUT: '4'
          SMOKE_MAX_TIME: '8'
          SMOKE_RETRIES: '1'
          SMOKE_RETRY_MAX_TIME: '18'

      - name: Trigger post-deploy WordPress cron
        if: ${{ !inputs.dry_run }}
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          base_url="${SMOKE_BASE_URL:-https://hasimuener.de}"
          cron_url="${base_url%/}/wp-cron.php?doing_wp_cron=$(date +%s)"
          if ! curl -fsS --max-time 20 "$cron_url" >/dev/null; then
            echo "::warning title=Post-deploy cron not triggered::WordPress cron could not be triggered; the next regular cron request can still process Search Console sync."
          fi
