name: Temporary Growth Audit Docs Cleanup

on:
  push:
    branches:
      - cleanup/remove-growth-audit-legacy-ui-v3-2026-09-15

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-growth-audit-legacy-ui-v3-2026-09-15
          fetch-depth: 0

      - name: Align architecture docs with retired Audit UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          system = 'docs/architecture/SYSTEM_MAP.md'
          replace_once(
              system,
              'Stand: 2026-05-25. Diese Karte basiert auf dem Repo-Inhalt plus punktueller Live-Verifikation der frueheren System-Diagnose-Route.',
              'Stand: 2026-09-15. Diese Karte basiert auf dem aktuellen Repo-Inhalt plus punktueller Live-Verifikation der früheren System-Diagnose-Routen.'
          )
          replace_once(
              system,
              '| Growth-Audit-Legacypfad | deaktivierter Instant-Diagnose-Legacycode; geschützte Audit-Einstiege führen zum Marktcheck, alte Tools liefern 410 | `blocksy-child/page-audit.php`, `blocksy-child/inc/audit-page.php`, `blocksy-child/inc/tools-page.php`, `blocksy-child/inc/cja-shortcode.php`, `blocksy-child/assets/css/cja-audit.css`, `blocksy-child/assets/js/cja-audit.js`, `docs/systems/audit-funnel.md` | n8n Webhook nur für Legacy-Code, WordPress | öffentlich retired; selektive 301 auf `/solar-waermepumpen-leadgenerierung/#marktcheck`, interne Tool-Altlasten 410 |',
              '| Audit-Legacy-Redirects | frühere Audit-UI entfernt; geschützte Alt-Einstiege führen zentral zum Marktcheck, alte Tools liefern 410 | `blocksy-child/inc/system-diagnose-page.php`, `docs/systems/audit-funnel.md` | WordPress | UI retired; selektive 301 auf `/solar-waermepumpen-leadgenerierung/#marktcheck`, interne Tool-Altlasten 410 |'
          )
          replace_once(
              system,
              'Die fruehere 8-Schritt-React-App bleibt Legacy-Code',
              'Die frühere Audit-/Instant-Results-UI ist aus der Runtime entfernt'
          )
          replace_once(
              system,
              'Bekannte technische Touchpoints:\n\n- `blocksy-child/inc/cja-shortcode.php`\n- `blocksy-child/assets/js/cja-audit.js`\n- `blocksy-child/assets/js/audit-live.js`\n- historische Webhook-Namen `audit`, `audit-status`, `cja-analyze`',
              'Historische technische Touchpoints:\n\n- `blocksy-child/assets/js/audit-live.js`\n- `blocksy-child/assets/css/audit-results.css`\n- `blocksy-child/page-360-deep-dive.php`\n- historische Webhook-Namen `audit`, `audit-status`, `cja-analyze`'
          )
          replace_once(
              system,
              '3. Der fruehere Instant-Results- und 48h-Audit-Code bleibt im Repo als Legacy-Layer, ist aber nicht mehr der Default-Flow.',
              '3. Die frühere Audit-/Instant-Results-UI ist aus der Runtime entfernt; verbleibende Deep-Dive-/Result-Artefakte werden separat als historische 3B-Reste bewertet.'
          )

          css = 'docs/architecture/CSS_ARCHITECTURE.md'
          replace_once(
              css,
              'Die shrink-only Baseline steht nach der Entkopplung der globalen Shell aktuell bei **30 NX-Verbraucherdateien**. `site-header.css` besitzt nur noch die tatsächlich gerenderte Audit-Variante, verwendet Canon-Motion plus lokale Audit-Farbrollen und wird zusammen mit `site-header.js` nur noch auf der Audit-Route geladen. `style.css` konsumiert keine `--nx-*`-Variablen mehr und ist aus der Baseline entfernt. Jeder verbleibende Verbraucher nutzt mindestens ein Token des Legacy-Providers; die Zahl darf nur sinken.',
              'Die shrink-only Baseline steht nach Entfernung der retired Audit-UI aktuell bei **28 NX-Verbraucherdateien**. Die Audit-only `site-header.css`/`site-header.js`-Schicht und das ungenutzte `audit.css` sind entfernt. `style.css` konsumiert keine `--nx-*`-Variablen mehr und ist aus der Baseline entfernt. Jeder verbleibende Verbraucher nutzt mindestens ein Token des Legacy-Providers; die Zahl darf nur sinken.'
          )
          replace_once(
              css,
              '1. **Globale Shell / Provider:** `site-header.css` und `style.css` sind von `--nx-*` entkoppelt. `design-system.css` wird auf der kanonischen Startseite, der Personenseite und dem Ergebnisse-Hub nicht mehr geladen. Auf allen übrigen Routen bleibt der Provider vorerst aktiv, weil er neben NX-Tokens auch unpräfixierte Tokens sowie globale `body`-/Heading-/Kompatibilitätsregeln bereitstellt.',
              '1. **Globale Shell / Provider:** Die Standardnavigation läuft über `.leiste` in `system.css` plus `leiste.js`; die retired Audit-Header-Assets sind entfernt. `style.css` ist von `--nx-*` entkoppelt. `design-system.css` wird auf der kanonischen Startseite, der Personenseite und dem Ergebnisse-Hub nicht mehr geladen. Auf allen übrigen Routen bleibt der Provider vorerst aktiv, weil er neben NX-Tokens auch unpräfixierte Tokens sowie globale `body`-/Heading-/Kompatibilitätsregeln bereitstellt.'
          )
          replace_once(
              css,
              '1. **Globale Shell (NX erledigt):** Audit-Header und `style.css` sind von `--nx-*` entkoppelt. Der Provider-Audit hat unpräfixierte Legacy-Tokens und globale Selektorwirkungen bestätigt; deshalb ist `design-system.css` zunächst auf Startseite, Personenseite und Ergebnisse-Hub abgeschaltet. Weitere Routen werden einzeln entkoppelt.',
              '1. **Globale Shell (NX erledigt):** Die retired Audit-Header-Schicht ist vollständig entfernt; `style.css` ist von `--nx-*` entkoppelt. Der Provider-Audit hat unpräfixierte Legacy-Tokens und globale Selektorwirkungen bestätigt; deshalb ist `design-system.css` zunächst auf Startseite, Personenseite und Ergebnisse-Hub abgeschaltet. Weitere Routen werden einzeln entkoppelt.'
          )

          live = 'docs/architecture/LIVE_STATUS.md'
          replace_once(
              live,
              '- **`site-header-premium.css` und `site-footer.css` sind abgelöst, nicht ergänzt** — beide Dateien sind entfernt. Damit verschwinden zwei abweichende Orangetöne und die gemischten Eckradien. `site-header.css` bleibt und trägt nur noch die Audit-Variante; Blog- und Energy-Routen erreichen `template-parts/site-header.php` ohnehin nicht (siehe `inc/header.php`).',
              '- **Die frühere Audit-Header-Schicht ist vollständig retired.** `site-header-premium.css` und `site-footer.css` waren bereits entfernt; nun sind auch das Audit-only `site-header.css` und `site-header.js` gelöscht. Die Standardnavigation läuft über `.leiste` in `system.css` plus `leiste.js`; Blog- und Energy-Kontexte behalten ihre eigenen Headerpfade.'
          )
          replace_once(
              live,
              'Neu: `assets/js/leiste.js` (Klappe, Escape, Klick daneben, gemessene Höhe als `--leiste-h`). `site-header.js` bleibt für Blog- und Audit-Kopf zuständig und findet auf den Leisten-Routen kein `[data-site-header]` mehr.',
              'Neu: `assets/js/leiste.js` (Klappe, Escape, Klick daneben, gemessene Höhe als `--leiste-h`). Der frühere Audit-spezifische `site-header.js`-Fallback ist entfernt; Blog- und Energy-Kontexte werden weiterhin über ihre eigenen Headerpfade behandelt.'
          )
          PY

      - name: Validate references
        shell: bash
        run: |
          ! grep -nF 'blocksy-child/page-audit.php' docs/architecture/SYSTEM_MAP.md
          ! grep -nF 'blocksy-child/inc/cja-shortcode.php' docs/architecture/SYSTEM_MAP.md
          ! grep -nF '`site-header.css` bleibt und trägt nur noch die Audit-Variante' docs/architecture/LIVE_STATUS.md
          ! grep -nF '**30 NX-Verbraucherdateien**' docs/architecture/CSS_ARCHITECTURE.md
          grep -nF '**28 NX-Verbraucherdateien**' docs/architecture/CSS_ARCHITECTURE.md

      - name: Commit docs cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/SYSTEM_MAP.md docs/architecture/CSS_ARCHITECTURE.md docs/architecture/LIVE_STATUS.md
          git diff --cached --check
          git commit -m "docs: retire Growth Audit architecture references"
          git push origin HEAD:cleanup/remove-growth-audit-legacy-ui-v3-2026-09-15
