name: CI

# Pull requests are the single integration gate.
# Production deployment happens in deploy.yml after merge without re-running this suite.
# No path filter: new/unknown dependencies must reach the conservative selector.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit on the same PR supersedes the older validation run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CHECK_HEAD: ${{ github.sha }}
      CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select checks from changed paths
        id: plan
        run: python3 scripts/check.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Read pinned toolchain
        id: toolchain
        run: python3 scripts/toolchain.py versions --github-output "$GITHUB_OUTPUT"

      - name: Cache exact PHP and Composer
        id: php-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/toolchain/php
            .build/toolchain/composer
          key: php-cli-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}

      - name: Install PHP build prerequisites
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libxml2-dev libcurl4-openssl-dev zlib1g-dev unzip xz-utils

      - name: Set up exact PHP and Composer
        run: python3 scripts/toolchain.py install-php --github-path "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        if: steps.plan.outputs.runtime == 'true'
        uses: devops-actions/actionlint@v0.1.11

      - name: Install check dependencies
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Set up Node.js
        if: steps.plan.outputs.runtime == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: 'npm'

      - name: Install Node build tooling
        if: steps.plan.outputs.runtime == 'true'
        run: npm ci

      - name: Run core repository checks
        run: python3 scripts/check.py --skip-browser --skip-analysis

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CHECK_HEAD: ${{ github.sha }}
      CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select checks from changed paths
        id: plan
        run: python3 scripts/check.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Read pinned toolchain
        if: steps.plan.outputs.runtime == 'true'
        id: toolchain
        run: python3 scripts/toolchain.py versions --github-output "$GITHUB_OUTPUT"

      - name: Cache exact PHP and Composer
        if: steps.plan.outputs.runtime == 'true'
        id: php-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/toolchain/php
            .build/toolchain/composer
          key: php-cli-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}

      - name: Install PHP build prerequisites
        if: steps.plan.outputs.runtime == 'true' && steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libxml2-dev libcurl4-openssl-dev zlib1g-dev unzip xz-utils

      - name: Set up exact PHP and Composer
        if: steps.plan.outputs.runtime == 'true'
        run: python3 scripts/toolchain.py install-php --github-path "$GITHUB_PATH"

      - name: Set up Node.js
        if: steps.plan.outputs.runtime == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: 'npm'

      - name: Install Node build tooling
        if: steps.plan.outputs.runtime == 'true'
        run: npm ci

      - name: Cache pinned Playwright browser
        if: steps.plan.outputs.runtime == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        if: steps.plan.outputs.runtime == 'true'
        run: npx playwright install-deps chromium

      - name: Install pinned Playwright browser
        if: steps.plan.outputs.runtime == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run isolated browser checks
        if: steps.plan.outputs.runtime == 'true'
        run: |
          npm run test:forms
          npm run test:navigation-ui

  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CHECK_HEAD: ${{ github.sha }}
      CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select checks from changed paths
        id: plan
        run: python3 scripts/check.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Read pinned toolchain
        if: steps.plan.outputs.runtime == 'true'
        id: toolchain
        run: python3 scripts/toolchain.py versions --github-output "$GITHUB_OUTPUT"

      - name: Cache exact PHP and Composer
        if: steps.plan.outputs.runtime == 'true'
        id: php-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/toolchain/php
            .build/toolchain/composer
          key: php-cli-ubuntu24-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}

      - name: Install PHP build prerequisites
        if: steps.plan.outputs.runtime == 'true' && steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libxml2-dev libcurl4-openssl-dev zlib1g-dev unzip xz-utils

      - name: Set up exact PHP and Composer
        if: steps.plan.outputs.runtime == 'true'
        run: python3 scripts/toolchain.py install-php --github-path "$GITHUB_PATH"

      - name: Install PHP analysis tooling
        if: steps.plan.outputs.runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer install --no-interaction --no-progress --prefer-dist; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Composer install failed after 3 attempts." >&2
              exit 1
            fi
            delay=$(( attempt * 5 ))
            echo "::warning::Composer install failed on attempt ${attempt}; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Run PHPStan
        if: steps.plan.outputs.runtime == 'true'
        run: php vendor/phpstan/phpstan/phpstan.phar analyse --no-progress --memory-limit=4G

  validate:
    if: always()
    needs: [core, browser, analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI partition
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in CORE BROWSER ANALYSIS; do
            variable="${name}_RESULT"
            result="${!variable}"
            if [[ "$result" != 'success' ]]; then
              echo "::error title=${name} CI failed::${name} partition finished with status ${result}."
              failed=1
            fi
          done
          exit "$failed"
