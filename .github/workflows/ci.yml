name: CI

# PRs validate the merge result; main validates the exact revision to deploy.
# No path filter: new/unknown dependencies must reach the conservative selector.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A docs-only push must never cancel a pending runtime validation/deploy.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CHECK_HEAD: ${{ github.sha }}
      CHECK_FULL: ${{ github.event_name == 'workflow_dispatch' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select checks from changed paths
        id: plan
        run: python3 scripts/check.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Validate GitHub Actions workflows
        if: steps.plan.outputs.runtime == 'true'
        uses: devops-actions/actionlint@v0.1.11

      - name: Install check dependencies
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Set up Node.js
        if: steps.plan.outputs.runtime == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node build tooling
        if: steps.plan.outputs.runtime == 'true'
        run: npm ci

      - name: Install browser for isolated UI tests
        if: steps.plan.outputs.runtime == 'true'
        run: npx playwright install --with-deps chromium

      - name: Install PHP analysis tooling
        if: steps.plan.outputs.runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer install --no-interaction --no-progress --prefer-dist; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Composer install failed after 3 attempts." >&2
              exit 1
            fi
            delay=$(( attempt * 5 ))
            echo "::warning::Composer install failed on attempt ${attempt}; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Run shared repository checks
        run: python3 scripts/check.py

  deploy-production:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.validate.outputs.deploy == 'true' }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      dry_run: false
      automatic: true
    secrets: inherit
