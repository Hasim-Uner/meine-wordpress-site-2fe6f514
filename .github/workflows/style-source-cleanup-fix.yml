name: Fix Style Cleanup Runner

on:
  push:
    branches:
      - refactor/style-source-cleanup-2026-09
    paths:
      - '.github/workflows/style-source-cleanup-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/style-source-cleanup-2026-09
      - name: Normalize generated workflow EOF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/style-source-cleanup-batch.yml')
          text = path.read_text(encoding='utf-8')
          old = "workflow.write_text(text, encoding='utf-8')"
          new = "workflow.write_text(text.rstrip() + '\\n', encoding='utf-8')"
          if text.count(old) != 1:
              raise SystemExit(f'expected one EOF writer, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/style-source-cleanup-batch.yml
          git commit -m 'Normalize generated CSS workflow EOF'
          git push origin HEAD:refactor/style-source-cleanup-2026-09
