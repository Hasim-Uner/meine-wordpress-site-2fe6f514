name: CSS Architecture

on:
  push:
    paths:
      - 'blocksy-child/assets/css/**'
      - 'blocksy-child/style.css'
      - 'scripts/audit-css-architecture.py'
      - 'scripts/audit-legacy-nx-css.py'
      - 'scripts/baselines/legacy-nx-consumers.txt'
      - 'scripts/collapse-gutachten-token-mirror.py'
      - 'scripts/prune-style-single-legacy.py'
      - 'scripts/build-theme-dist.sh'
      - 'docs/architecture/CSS_ARCHITECTURE.md'
      - '.github/workflows/css-architecture.yml'
  pull_request:
    paths:
      - 'blocksy-child/assets/css/**'
      - 'blocksy-child/style.css'
      - 'scripts/audit-css-architecture.py'
      - 'scripts/audit-legacy-nx-css.py'
      - 'scripts/baselines/legacy-nx-consumers.txt'
      - 'scripts/collapse-gutachten-token-mirror.py'
      - 'scripts/prune-style-single-legacy.py'
      - 'scripts/build-theme-dist.sh'
      - 'docs/architecture/CSS_ARCHITECTURE.md'
      - '.github/workflows/css-architecture.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CSS token ownership
        run: python3 scripts/audit-css-architecture.py

      - name: Inventory legacy NX consumers
        run: python3 scripts/audit-legacy-nx-css.py
      - name: Verify deployment single-style prune
        run: |
          cp blocksy-child/style.css /tmp/blocksy-child-style.css
          python3 scripts/prune-style-single-legacy.py \
            /tmp/blocksy-child-style.css \
            blocksy-child/assets/css/single.css
          if grep -q 'NEXUS SINGLE PAGE LAYOUT' /tmp/blocksy-child-style.css; then
            echo 'Superseded single-post block is still present after prune.' >&2
            exit 1
          fi
          grep -q 'NEXUS ARCHIVE LAYOUT' /tmp/blocksy-child-style.css
