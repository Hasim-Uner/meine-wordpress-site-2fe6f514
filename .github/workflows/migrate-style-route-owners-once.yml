name: Update CSS architecture docs once

on:
  push:
    paths:
      - '.github/workflows/migrate-style-route-owners-once.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update architecture documentation
        run: python3 scripts/update-css-architecture-doc.py

      - name: Validate CSS architecture
        run: python3 scripts/audit-css-architecture.py

      - name: Validate legacy NX baseline
        run: python3 scripts/audit-legacy-nx-css.py

      - name: Validate diff
        run: git diff --check && git diff -- docs/architecture/CSS_ARCHITECTURE.md

      - name: Commit documentation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/CSS_ARCHITECTURE.md
          git diff --cached --quiet && exit 1
          git commit -m 'Document NX-free global style shell'
          git push origin HEAD:${GITHUB_REF_NAME}
