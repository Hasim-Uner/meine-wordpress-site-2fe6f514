name: One-time marketcheck hero entry

on:
  push:
    branches:
      - cro/marketcheck-hero-entry-2026-09
    paths:
      - .github/workflows/one-time-marketcheck-hero-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cro/marketcheck-hero-entry-2026-09
          fetch-depth: 0

      - name: Patch hero CTA contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('blocksy-child/page-solar-waermepumpen-leadgenerierung.php')
          text = path.read_text()
          old = '''\t\t\t\t\t<div class="ausgang">\n\t\t\t\t\t\t<a class="tun" href="#strecke"\n\t\t\t\t\t\t\tdata-track-action="cta_strecke_kopf_to_stationen"\n\t\t\t\t\t\t\tdata-track-category="navigation"\n\t\t\t\t\t\t\tdata-track-section="dokumentkopf"\n\t\t\t\t\t\t>Die fünf Stationen <span class="pf" aria-hidden="true">→</span></a>\n\t\t\t\t\t\t<a class="tun still" href="#einstieg"\n\t\t\t\t\t\t\tdata-track-action="cta_strecke_kopf_to_leiter"\n\t\t\t\t\t\t\tdata-track-category="offer"\n\t\t\t\t\t\t\tdata-track-section="dokumentkopf"\n\t\t\t\t\t\t>Einstieg ab <?php echo esc_html( $entry_price ); ?></a>\n\t\t\t\t\t</div>'''
          new = '''\t\t\t\t\t<div class="ausgang">\n\t\t\t\t\t\t<a class="tun" href="#marktcheck"\n\t\t\t\t\t\t\tdata-track-action="cta_strecke_kopf_to_marktcheck"\n\t\t\t\t\t\t\tdata-track-category="lead_gen"\n\t\t\t\t\t\t\tdata-track-section="dokumentkopf"\n\t\t\t\t\t\t>Marktcheck starten <span class="pf" aria-hidden="true">→</span></a>\n\t\t\t\t\t\t<a class="tun still" href="#strecke"\n\t\t\t\t\t\t\tdata-track-action="cta_strecke_kopf_to_stationen"\n\t\t\t\t\t\t\tdata-track-category="navigation"\n\t\t\t\t\t\t\tdata-track-section="dokumentkopf"\n\t\t\t\t\t\t>Die fünf Stationen</a>\n\t\t\t\t\t</div>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one hero CTA block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l blocksy-child/page-solar-waermepumpen-leadgenerierung.php
          grep -F 'data-track-action="cta_strecke_kopf_to_marktcheck"' blocksy-child/page-solar-waermepumpen-leadgenerierung.php
          grep -F '>Marktcheck starten <span' blocksy-child/page-solar-waermepumpen-leadgenerierung.php

      - name: Commit product change and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-marketcheck-hero-entry.yml
          git add blocksy-child/page-solar-waermepumpen-leadgenerierung.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Route solar hero to marketcheck"
          git push origin HEAD:cro/marketcheck-hero-entry-2026-09
