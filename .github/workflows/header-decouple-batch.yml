name: Audit Header Decouple Batch
# One-time migration runner; removed before PR.

on:
  push:
    branches:
      - refactor/audit-header-decouple-2026-09
    paths:
      - '.github/workflows/header-decouple-batch.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/audit-header-decouple-2026-09

      - name: Decouple audit header runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          enqueue = Path('blocksy-child/inc/enqueue.php')
          lines = enqueue.read_text(encoding='utf-8').splitlines()

          def unique_index(stripped):
              matches = [i for i, line in enumerate(lines) if line.strip() == stripped]
              if len(matches) != 1:
                  raise SystemExit(f'enqueue.php: expected one line {stripped!r}, got {len(matches)}')
              return matches[0]

          route_anchor = "$is_provider_decision   = $is_checkfox_decision || $is_aroundhome_decision;"
          i = unique_index(route_anchor)
          lines.insert(i + 1, "\t$is_audit_route = function_exists( 'nexus_is_audit_page' ) && nexus_is_audit_page();")

          i = unique_index('// ── GLOBAL: Design System (Single Source of Truth) ─────────────')
          lines[i] = '\t// ── GLOBAL: Legacy compatibility provider ─────────────────────'
          lines.insert(i + 1, '\t// Bleibt vorerst global, bis style.css als letzter Shell-Blocker entkoppelt ist.')

          i = unique_index("hu_enqueue_css( 'nexus-system-css', 'system.css', [ 'nexus-design-system' ] );")
          lines[i] = "\thu_enqueue_css( 'nexus-system-css', 'system.css', [ 'blocksy-child-style' ] );"

          css_line = "hu_enqueue_css( 'nexus-site-header-css', 'site-header.css', [ 'nexus-system-css' ] );"
          i = unique_index(css_line)
          lines[i] = "\tif ( $is_audit_route ) {\n\t\thu_enqueue_css( 'nexus-site-header-css', 'site-header.css', [ 'nexus-system-css' ] );\n\t}"
          if i >= 2:
              lines[i - 2] = '\t// ── Audit header only ──────────────────────────────────────────'
              lines[i - 1] = '\t// Standardrouten verwenden .leiste aus system.css + leiste.js.'

          js_line = "hu_enqueue_js( 'nexus-site-header-js', 'site-header.js', [ 'nexus-core-js' ] );"
          i = unique_index(js_line)
          lines[i] = "\tif ( $is_audit_route ) {\n\t\thu_enqueue_js( 'nexus-site-header-js', 'site-header.js', [ 'nexus-core-js' ] );\n\t}"

          audit_predicate = "&& ( ! function_exists( 'nexus_is_audit_page' ) || ! nexus_is_audit_page() )"
          i = unique_index(audit_predicate)
          lines[i] = '\t\t&& ! $is_audit_route'

          text = '\n'.join(lines) + '\n'
          required = [
              "$is_audit_route = function_exists( 'nexus_is_audit_page' ) && nexus_is_audit_page();",
              "hu_enqueue_css( 'nexus-system-css', 'system.css', [ 'blocksy-child-style' ] );",
              "if ( $is_audit_route ) {\n\t\thu_enqueue_css( 'nexus-site-header-css', 'site-header.css', [ 'nexus-system-css' ] );",
              "if ( $is_audit_route ) {\n\t\thu_enqueue_js( 'nexus-site-header-js', 'site-header.js', [ 'nexus-core-js' ] );",
              '&& ! $is_audit_route',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'enqueue.php: migration contract missing {needle!r}')
          enqueue.write_text(text, encoding='utf-8')

          doc = Path('docs/architecture/CSS_ARCHITECTURE.md')
          text = doc.read_text(encoding='utf-8')
          replacements = {
              'Die shrink-only Baseline steht damit aktuell bei **34 NX-Verbraucherdateien**. Jeder verbleibende Verbraucher nutzt mindestens ein Token des Legacy-Providers; die Zahl darf nur sinken.':
              'Die shrink-only Baseline steht nach der Entkopplung des Audit-Headers aktuell bei **33 NX-Verbraucherdateien**. `site-header.css` besitzt nur noch die tatsächlich gerenderte Audit-Variante, verwendet Canon-Motion plus lokale Audit-Farbrollen und wird zusammen mit `site-header.js` nur noch auf der Audit-Route geladen. Jeder verbleibende Verbraucher nutzt mindestens ein Token des Legacy-Providers; die Zahl darf nur sinken.',
              '1. **Globale Shell / Blocker:** `style.css` und `site-header.css`. Solange diese beiden breit `--nx-*` konsumieren, kann der Legacy-Provider nicht sicher global abgeschaltet werden.':
              '1. **Globale Shell / Blocker:** `site-header.css` ist entkoppelt; `style.css` ist jetzt der verbleibende globale Shell-Blocker. Der Legacy-Provider kann erst bedingt geladen werden, wenn dessen aktive globale NX-Regeln isoliert oder migriert sind.',
              '1. **Globale Shell:** `style.css` und `site-header.css` inventarisieren und ihre wirklich global benötigten Primitive von den alten Seiten-/Blocksy-Regeln trennen. Das ist der Hauptblocker für einen bedingten Legacy-Provider.':
              '1. **Globale Shell:** Audit-Header ist entkoppelt. `style.css` bleibt der letzte globale Blocker und wird als Nächstes in echte WordPress-/Font-Foundation versus alte Blocksy-/Route-Regeln zerlegt.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'CSS_ARCHITECTURE.md: expected one migration anchor, got {text.count(old)}')
              text = text.replace(old, new, 1)
          doc.write_text(text, encoding='utf-8')
          PY

      - name: Verify contracts
        run: |
          python3 scripts/audit-css-architecture.py
          python3 scripts/audit-legacy-nx-css.py
          bash scripts/lint-css-spacing.sh
          bash scripts/lint-css-motion.sh
          php -l blocksy-child/inc/enqueue.php
          if grep -q -- '--nx-' blocksy-child/assets/css/site-header.css; then
            echo 'site-header.css still contains a legacy NX token.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocksy-child/inc/enqueue.php docs/architecture/CSS_ARCHITECTURE.md
          git commit -m 'Load legacy audit header only on audit routes'
          git push origin HEAD:refactor/audit-header-decouple-2026-09
