name: Temporary Growth Audit Deadref Cleanup

on:
  push:
    branches:
      - cleanup/remove-growth-audit-legacy-ui-v3-2026-09-15

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-growth-audit-legacy-ui-v3-2026-09-15
          fetch-depth: 0

      - name: Remove retired Audit dead references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def remove_php_function(path, name):
              text = read(path)
              marker = f'function {name}('
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected exactly one {name} definition, found {text.count(marker)}')
              fn = text.index(marker)
              doc = text.rfind('/**', 0, fn)
              if doc < 0 or text.find('*/', doc, fn) < 0:
                  raise SystemExit(f'{path}: docblock not found for {name}')
              brace = text.find('{', fn)
              if brace < 0:
                  raise SystemExit(f'{path}: opening brace not found for {name}')
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'{path}: closing brace not found for {name}')
              while end < len(text) and text[end] == '\n':
                  end += 1
                  if end < len(text) and text[end] != '\n':
                      break
              new = text[:doc] + text[end:]
              if marker in new:
                  raise SystemExit(f'{path}: failed to remove {name}')
              write(path, new)

          # functions.php: remove includes for files deleted by PR #413.
          replace_once(
              'blocksy-child/functions.php',
              "\t'cja-shortcode.php',  // Instant-Results System-Diagnose als Shortcode\n\t'audit-page.php',     // Audit-Shell-Fallback für die Audit-Landing-Page\n",
              ''
          )
          replace_once(
              'blocksy-child/functions.php',
              "\t'review-crm.php',     // Growth-Audit-Intake + WordPress CRM\n",
              "\t'review-crm.php',     // Marktcheck-Intake + WordPress CRM\n"
          )

          # helpers.php: keep the marketcheck compatibility URL, remove dead page detection/header helpers.
          remove_php_function('blocksy-child/inc/helpers.php', 'nexus_get_audit_page_id')
          remove_php_function('blocksy-child/inc/helpers.php', 'nexus_is_audit_page')
          remove_php_function('blocksy-child/inc/helpers.php', 'nexus_get_audit_header_meta_items')
          replace_once(
              'blocksy-child/inc/helpers.php',
              "\t\t'header_meta_items' => [\n\t\t\t'Manueller Marktcheck',\n\t\t\t'Fokus: Solar, Wärmepumpe, Speicher',\n\t\t],\n",
              ''
          )

          # seo-meta.php: unused compatibility predicate depended on removed page detection.
          remove_php_function('blocksy-child/inc/seo-meta.php', 'hu_is_audit_offer_page')

          # enqueue.php: remove the retired Audit header asset route and its defer exceptions.
          replace_once(
              'blocksy-child/inc/enqueue.php',
              "\t$is_audit_route = function_exists( 'nexus_is_audit_page' ) && nexus_is_audit_page();\n",
              ''
          )
          replace_once(
              'blocksy-child/inc/enqueue.php',
              "\t// ── Audit header only ──────────────────────────────────────────\n\t// Standardrouten verwenden .leiste aus system.css + leiste.js.\n\tif ( $is_audit_route ) {\n\t\thu_enqueue_css( 'nexus-site-header-css', 'site-header.css', [ 'nexus-system-css' ] );\n\t}\n\n",
              ''
          )
          replace_once(
              'blocksy-child/inc/enqueue.php',
              "\thu_enqueue_js( 'nexus-core-js', 'nexus-core.js' );\n\tif ( $is_audit_route ) {\n\t\thu_enqueue_js( 'nexus-site-header-js', 'site-header.js', [ 'nexus-core-js' ] );\n\t}\n",
              "\thu_enqueue_js( 'nexus-core-js', 'nexus-core.js' );\n"
          )
          replace_once(
              'blocksy-child/inc/enqueue.php',
              "\t/*\n\t * Die Leiste bringt ihr eigenes, kleines Skript mit: Klappblatt auf\n\t * schmalen Schirmen, gemessene Hoehe als --leiste-h. site-header.js bleibt\n\t * fuer Blog- und Audit-Kopf zustaendig und findet auf den Leisten-Routen\n\t * kein [data-site-header] mehr.\n\t */\n",
              "\t/*\n\t * Die Leiste bringt ihr eigenes, kleines Skript mit: Klappblatt auf\n\t * schmalen Schirmen und gemessene Hoehe als --leiste-h.\n\t */\n"
          )
          replace_once(
              'blocksy-child/inc/enqueue.php',
              "\t$uses_leiste = ( ! function_exists( 'nexus_is_blog_header_context' ) || ! nexus_is_blog_header_context() )\n\t\t&& ! $is_audit_route\n\t\t&& ( ! function_exists( 'nexus_is_energy_systems_context' ) || ! nexus_is_energy_systems_context() )",
              "\t$uses_leiste = ( ! function_exists( 'nexus_is_blog_header_context' ) || ! nexus_is_blog_header_context() )\n\t\t&& ( ! function_exists( 'nexus_is_energy_systems_context' ) || ! nexus_is_energy_systems_context() )"
          )
          enqueue = read('blocksy-child/inc/enqueue.php')
          handle_line = "\t\t\t'nexus-site-header-js',\n"
          if enqueue.count(handle_line) != 2:
              raise SystemExit(f'enqueue.php: expected two stale defer-handle lines, found {enqueue.count(handle_line)}')
          enqueue = enqueue.replace(handle_line, '')
          if any(token in enqueue for token in ('is_audit_route', 'nexus-site-header-css', 'nexus-site-header-js', "'site-header.css'", "'site-header.js'")):
              raise SystemExit('enqueue.php: stale Audit/site-header references remain')
          write('blocksy-child/inc/enqueue.php', enqueue)

          # site-header.php: the only remaining rendered Audit header branch is retired.
          header_path = 'blocksy-child/template-parts/site-header.php'
          header = read(header_path)
          old_doc = " * Die Audit-Variante bleibt unveraendert und laeuft weiter auf\n * site-header.css. Blog- und Energy-Kontexte erreichen diese Datei nicht\n * (siehe inc/header.php).\n *\n"
          if header.count(old_doc) != 1:
              raise SystemExit('site-header.php: Audit doc paragraph mismatch')
          header = header.replace(old_doc, '', 1)

          request_start = "$request_url = $routes['marketcheck'] ?? ( function_exists( 'hu_get_request_analysis_url' )"
          request_end = "$audit_header_meta_items = function_exists( 'nexus_get_audit_header_meta_items' ) ? nexus_get_audit_header_meta_items() : [];\n"
          if header.count(request_start) != 1 or header.count(request_end) != 1:
              raise SystemExit('site-header.php: Audit request/meta declarations mismatch')
          a = header.index(request_start)
          b = header.index(request_end, a) + len(request_end)
          header = header[:a] + header[b:]

          fallback = "if ( empty( $audit_header_meta_items ) ) {\n\t$audit_header_meta_items = [\n\t\t'Manueller Marktcheck',\n\t\t'Solar- und Wärmepumpen-Fokus',\n\t];\n}\n"
          if header.count(fallback) != 1:
              raise SystemExit('site-header.php: Audit fallback mismatch')
          header = header.replace(fallback, '', 1)

          branch_start = "<?php if ( function_exists( 'nexus_is_audit_page' ) && nexus_is_audit_page() ) : ?>\n"
          branch_end = "<?php return; endif; ?>\n\n"
          if header.count(branch_start) != 1 or header.count(branch_end) != 1:
              raise SystemExit('site-header.php: Audit branch markers mismatch')
          a = header.index(branch_start)
          b = header.index(branch_end, a) + len(branch_end)
          header = header[:a] + header[b:]
          if any(token in header for token in ('nexus_is_audit_page', 'audit_header_meta_items', 'nx-site-header--audit', 'data-track-section="audit_header"')):
              raise SystemExit('site-header.php: stale Audit header references remain')
          write(header_path, header)

          # Shrink baselines for the genuinely retired legacy stylesheet.
          replace_once(
              'scripts/baselines/legacy-nx-consumers.txt',
              'blocksy-child/assets/css/audit.css\n',
              ''
          )
          replace_once(
              'scripts/lint-css-motion.sh',
              '  "audit.css"\n',
              ''
          )

          # Remove assets with no runtime consumer after the Audit header/UI retirement.
          for dead in (
              'blocksy-child/assets/css/site-header.css',
              'blocksy-child/assets/js/site-header.js',
              'blocksy-child/assets/css/audit.css',
          ):
              p = Path(dead)
              if not p.is_file():
                  raise SystemExit(f'expected dead asset missing before cleanup: {dead}')
              p.unlink()

          # Final code-level invariants for this pass.
          for path in (
              'blocksy-child/functions.php',
              'blocksy-child/inc/helpers.php',
              'blocksy-child/inc/enqueue.php',
              'blocksy-child/inc/seo-meta.php',
              'blocksy-child/template-parts/site-header.php',
          ):
              text = read(path)
              for stale in ('page-audit.php', 'nexus_is_audit_page'):
                  if stale in text:
                      raise SystemExit(f'{path}: stale token remains: {stale}')
          PY

      - name: Validate PHP syntax and targeted references
        shell: bash
        run: |
          php -l blocksy-child/functions.php
          php -l blocksy-child/inc/helpers.php
          php -l blocksy-child/inc/enqueue.php
          php -l blocksy-child/inc/seo-meta.php
          php -l blocksy-child/template-parts/site-header.php
          ! grep -R --line-number --fixed-strings "nexus_is_audit_page" blocksy-child/functions.php blocksy-child/inc blocksy-child/template-parts/site-header.php
          ! grep -R --line-number --fixed-strings "page-audit.php" blocksy-child/functions.php blocksy-child/inc blocksy-child/template-parts/site-header.php
          ! grep -R --line-number --fixed-strings "site-header.css" blocksy-child/inc blocksy-child/template-parts/site-header.php
          ! grep -R --line-number --fixed-strings "site-header.js" blocksy-child/inc blocksy-child/template-parts/site-header.php
          bash scripts/lint-css-motion.sh
          python3 scripts/audit-theme-assets.py

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-growth-audit-deadrefs-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove Growth Audit dead references"
          git push origin HEAD:cleanup/remove-growth-audit-legacy-ui-v3-2026-09-15
