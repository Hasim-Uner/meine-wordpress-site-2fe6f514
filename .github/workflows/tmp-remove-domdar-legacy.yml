name: Temporary DOMDAR legacy cleanup

on:
  push:
    branches:
      - cleanup/remove-domdar-legacy-2026-09-14

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-domdar-legacy-2026-09-14
          fetch-depth: 0

      - name: Apply asserted DOMDAR cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          # Helpers: remove retired DOMDAR page/template ownership.
          replace_exact('blocksy-child/inc/helpers.php', "\t\t|| is_page_template( 'page-case-study-domdar.php' )\n", '')
          replace_exact('blocksy-child/inc/helpers.php', "\t\t'page-case-study-domdar.php',\n", '')
          replace_exact(
              'blocksy-child/inc/helpers.php',
              "\t\t'domdar'               => nexus_get_page_url(\n\t\t\t[ 'case-study-domdar', 'domdar' ],\n\t\t\thome_url( '/case-study-domdar/' )\n\t\t),\n",
              ''
          )

          # Enqueue: DOMDAR was the only consumer of case-study.css.
          replace_exact(
              'blocksy-child/inc/enqueue.php',
              "\n\t// ── Q) Template: Öffentliche Case Studies ──────────────────────\n\tif ( is_page_template( 'page-case-study-domdar.php' ) || is_page( 'case-study-domdar' ) ) {\n\t\thu_enqueue_css( 'nexus-home-css', 'homepage.css', [ 'nexus-design-system' ] );\n\t\thu_enqueue_css( 'nexus-case-study-css', 'case-study.css', [ 'nexus-home-css' ] );\n\t}\n",
              "\n"
          )

          # SEO meta: remove the now-unused DOMDAR route helper completely.
          replace_exact(
              'blocksy-child/inc/seo-meta.php',
              "/**\n * Check whether current query is the DOMDAR case-study page.\n *\n * @return bool\n */\nfunction hu_is_domdar_case_study_page() {\n\tif ( ! is_singular() ) {\n\t\treturn false;\n\t}\n\n\t$post_id = get_queried_object_id();\n\tif ( ! $post_id ) {\n\t\treturn false;\n\t}\n\n\t$slug = get_post_field( 'post_name', $post_id );\n\n\treturn in_array( $slug, [ 'case-study-domdar', 'domdar' ], true );\n}\n\n",
              ''
          )

          # SEO cockpit: stop synthesizing/classifying a route that is 404.
          replace_exact(
              'blocksy-child/inc/seo-cockpit/seo-cockpit-links.php',
              "\t\t\t\t$primary_urls['domdar'] ?? home_url( '/case-study-domdar/' ),\n",
              ''
          )
          replace_exact(
              'blocksy-child/inc/seo-cockpit/seo-cockpit-insights.php',
              "$paths['results'] ?? '', $paths['e3'] ?? '', $paths['domdar'] ?? '', $paths['whitelabel'] ?? ''",
              "$paths['results'] ?? '', $paths['e3'] ?? '', $paths['whitelabel'] ?? ''"
          )

          # WGOS proof count must match the live public proof routes.
          replace_exact('blocksy-child/inc/wgos/wgos-cluster-pages.php', "'value' => '3 Proof-Routen'", "'value' => '2 Proof-Routen'")
          replace_exact(
              'blocksy-child/inc/wgos/wgos-cluster-pages.php',
              "'label' => 'Case Study, DOMDAR und Ergebnisse sind öffentlich einsehbar'",
              "'label' => 'Case Study und Ergebnisse sind öffentlich einsehbar'"
          )

          # Active architecture docs: point to current proof surfaces, not DOMDAR.
          replace_exact(
              'blocksy-child/docs/architecture/page-architecture.md',
              '- page-case-study-domdar.php',
              '- page-e3-new-energy.php\n- page-ergebnisse.php'
          )
          replace_exact(
              'docs/architecture/CONVERSION_ROUTING.md',
              '- the DOMDAR e-commerce case study — a cart-and-margin case with no energy context\n',
              ''
          )

          # CSS architecture and guards shrink together with deletion of case-study.css.
          replace_exact('docs/architecture/CSS_ARCHITECTURE.md', '31 NX-Verbraucherdateien', '30 NX-Verbraucherdateien')
          replace_exact(
              'docs/architecture/CSS_ARCHITECTURE.md',
              '`homepage.css`, `wgos.css`, `wgos-assets.css`, `case-study.css`.',
              '`homepage.css`, `wgos.css`, `wgos-assets.css`.'
          )
          replace_exact(
              'scripts/baselines/legacy-nx-consumers.txt',
              'blocksy-child/assets/css/case-study.css\n',
              ''
          )
          replace_exact(
              'scripts/lint-css-motion.sh',
              '  "case-study.css"\n',
              ''
          )

          # DOMDAR-only heading selectors no longer belong in global typography lists.
          for path in ['blocksy-child/style.css', 'blocksy-child/assets/css/design-system.css']:
              replace_exact(
                  path,
                  '.cs-case-hero__title,\n.cs-phase-title,\n.cs-budget-proof__title,\n',
                  ''
              )
          PY

          test -f blocksy-child/page-case-study-domdar.php
          test -f blocksy-child/assets/css/case-study.css
          rm blocksy-child/page-case-study-domdar.php
          rm blocksy-child/assets/css/case-study.css

      - name: Verify DOMDAR runtime is gone
        shell: bash
        run: |
          test ! -e blocksy-child/page-case-study-domdar.php
          test ! -e blocksy-child/assets/css/case-study.css
          ! grep -Fi "domdar" \
            blocksy-child/inc/helpers.php \
            blocksy-child/inc/enqueue.php \
            blocksy-child/inc/seo-meta.php \
            blocksy-child/inc/seo-cockpit/seo-cockpit-links.php \
            blocksy-child/inc/seo-cockpit/seo-cockpit-insights.php \
            blocksy-child/inc/wgos/wgos-cluster-pages.php \
            blocksy-child/docs/architecture/page-architecture.md \
            docs/architecture/CONVERSION_ROUTING.md
          ! grep -F "case-study.css" \
            blocksy-child/inc/enqueue.php \
            docs/architecture/CSS_ARCHITECTURE.md \
            scripts/baselines/legacy-nx-consumers.txt \
            scripts/lint-css-motion.sh
          ! grep -F ".cs-case-hero__title" blocksy-child/style.css blocksy-child/assets/css/design-system.css
          ! grep -F ".cs-phase-title" blocksy-child/style.css blocksy-child/assets/css/design-system.css
          ! grep -F ".cs-budget-proof__title" blocksy-child/style.css blocksy-child/assets/css/design-system.css

      - name: Run targeted guards
        shell: bash
        run: |
          git diff --check
          bash scripts/lint-css-motion.sh
          python3 scripts/audit-legacy-nx-css.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove retired DOMDAR case study"
          git push origin HEAD:cleanup/remove-domdar-legacy-2026-09-14
