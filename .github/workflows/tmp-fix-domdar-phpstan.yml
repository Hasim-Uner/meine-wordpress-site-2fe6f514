name: Temporary DOMDAR PHPStan repair

on:
  push:
    branches:
      - cleanup/remove-domdar-legacy-2026-09-14

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-domdar-legacy-2026-09-14
          fetch-depth: 0

      - name: Remove remaining DOMDAR SEO branches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('blocksy-child/inc/seo-meta.php')
          text = path.read_text()

          def replace_exact(old, new='', expected=1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} matches, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          replace_exact("/**\n * Get the SEO title for the DOMDAR case study.\n *\n * @return string\n */\nfunction hu_get_domdar_case_study_title() {\n\treturn 'Case Study: DOMDAR | Sustainable Commerce | Haşim Üner';\n}\n\n")
          replace_exact("/**\n * Get the SEO description for the DOMDAR case study.\n *\n * @return string\n */\nfunction hu_get_domdar_case_study_description() {\n\treturn 'Vom 54€ Warenkorb zur 120€ Profit-Maschine in 6 Wochen. Wie wir ohne Budget-Erhöhung die Conversion auf 4,6% steigerten.';\n}\n\n")
          replace_exact("\n\tif ( hu_is_domdar_case_study_page() ) {\n\t\t$post_id   = get_queried_object_id();\n\t\t$seo_title = hu_get_stored_seo_value( $post_id, 'seo_title', 'rank_math_title' );\n\n\t\treturn '' !== $seo_title ? $seo_title : hu_get_domdar_case_study_title();\n\t}\n")
          replace_exact("\n\t\tif ( hu_is_domdar_case_study_page() ) {\n\t\t\t$seo_title       = hu_get_stored_seo_value( $post_id, 'seo_title', 'rank_math_title' );\n\t\t\t$seo_description = hu_get_stored_seo_value( $post_id, 'seo_description', 'rank_math_description' );\n\n\t\t\tif ( '' === $seo_title ) {\n\t\t\t\t$meta['og_title'] = hu_get_domdar_case_study_title();\n\t\t\t}\n\n\t\t\tif ( '' === $seo_description ) {\n\t\t\t\t$meta['description'] = hu_get_domdar_case_study_description();\n\t\t\t}\n\t\t}\n")

          path.write_text(text)
          PY

          ! grep -Fi "domdar" blocksy-child/inc/seo-meta.php
          php -l blocksy-child/inc/seo-meta.php
          git diff --check

      - name: Run PHPStan
        shell: bash
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer analyse:php

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocksy-child/inc/seo-meta.php
          git diff --cached --check
          git commit -m "fix: remove remaining DOMDAR SEO branches"
          git push origin HEAD:cleanup/remove-domdar-legacy-2026-09-14
