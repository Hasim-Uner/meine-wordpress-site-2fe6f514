name: Temporary Meta Ads CI Fix

on:
  push:
    branches:
      - cleanup/meta-ads-legacy-2026-09-15

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/meta-ads-legacy-2026-09-15
          fetch-depth: 0

      - name: Make WP output mode shim-safe and validate crawler contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('blocksy-child/inc/helpers.php')
          text = path.read_text()
          old = "get_page_by_path( 'meta-ads-fuer-b2b', OBJECT, 'post' )"
          new = "get_page_by_path( 'meta-ads-fuer-b2b', 'OBJECT', 'post' )"
          count = text.count(old)
          assert count == 1, f'expected exactly one OBJECT call, got {count}'
          path.write_text(text.replace(old, new))
          PY

          php -l blocksy-child/inc/helpers.php
          php scripts/lint-entity-crawler-signals.php
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocksy-child/inc/helpers.php
          git commit -m 'fix: make Meta Ads redirect resolver shim-safe'
          git push origin HEAD:cleanup/meta-ads-legacy-2026-09-15
