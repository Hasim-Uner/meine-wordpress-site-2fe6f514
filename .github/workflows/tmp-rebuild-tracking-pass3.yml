name: Temporary rebuild tracking pass3

on:
  push:
    branches:
      - feat/tracking-offer-proof-pass3

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tracking-offer-proof-pass3
          fetch-depth: 0

      - name: Rebuild feature on current main
        shell: bash
        run: |
          set -euo pipefail
          OLD_BASE='c8750f7badab7792cccacce58aa1f4c03a96568e'
          OLD_HEAD='812c0095d1ed6cf85e62db6c469e1be35c12b4b5'
          EXPECTED_REMOTE_HEAD="$(git rev-parse HEAD)"

          git diff "$OLD_BASE" "$OLD_HEAD" -- \
            blocksy-child/assets/css/tracking-setup.css \
            blocksy-child/inc/canon/messaging-canon.php \
            blocksy-child/inc/commercial-routing.php \
            blocksy-child/page-ga4.php > /tmp/tracking-pass3.patch

          git checkout -B tracking-clean origin/main
          git apply --3way /tmp/tracking-pass3.patch

          python3 - <<'PY'
          from pathlib import Path
          path = Path('blocksy-child/inc/canon/messaging-canon.php')
          text = path.read_text()
          old = "$setup_value       = (int) $setup_value === $setup_value ? (int) $setup_value : $setup_value;"
          new = "$setup_value       = floor( $setup_value ) === $setup_value ? (int) $setup_value : $setup_value;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one PHPStan comparison, found {count}')
          path.write_text(text.replace(old, new))
          PY

          php -l blocksy-child/inc/canon/messaging-canon.php
          git diff --check
          composer install --no-interaction --no-progress --prefer-dist
          composer analyse:php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            blocksy-child/assets/css/tracking-setup.css \
            blocksy-child/inc/canon/messaging-canon.php \
            blocksy-child/inc/commercial-routing.php \
            blocksy-child/page-ga4.php
          git diff --cached --check
          git commit -m "fix: rebuild tracking offer proof on current main"
          git push --force-with-lease=refs/heads/feat/tracking-offer-proof-pass3:"$EXPECTED_REMOTE_HEAD" origin HEAD:refs/heads/feat/tracking-offer-proof-pass3
