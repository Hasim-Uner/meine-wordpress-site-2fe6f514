name: Conditionalize design system once

on:
  push:
    paths:
      - '.github/workflows/conditionalize-design-system-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded enqueue migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          enqueue = Path('blocksy-child/inc/enqueue.php')
          text = enqueue.read_text(encoding='utf-8')
          old = """\t// ── GLOBAL: Legacy compatibility provider ─────────────────────\n\t// Bleibt vorerst global, bis style.css als letzter Shell-Blocker entkoppelt ist.\n\thu_enqueue_css( 'nexus-design-system', 'design-system.css', [ 'blocksy-child-style' ] );\n"""
          new = """\t// ── Legacy compatibility provider ──────────────────────────────\n\t// Die kanonische Startseite und die Personenseite stehen vollstaendig auf\n\t// system.css und konsumieren weder NX- noch unpraefixierte Provider-Tokens.\n\t// Alle anderen Routen behalten den Legacy-Provider, bis ihre impliziten\n\t// Token-/Selector-Abhaengigkeiten einzeln nachgewiesen und migriert sind.\n\t$uses_legacy_design_system = ! ( is_front_page() || hu_is_person_page() );\n\tif ( $uses_legacy_design_system ) {\n\t\thu_enqueue_css( 'nexus-design-system', 'design-system.css', [ 'blocksy-child-style' ] );\n\t}\n"""
          if text.count(old) != 1:
              raise SystemExit(f'enqueue anchor count: {text.count(old)}')
          enqueue.write_text(text.replace(old, new), encoding='utf-8')

          docs = Path('docs/architecture/CSS_ARCHITECTURE.md')
          d = docs.read_text(encoding='utf-8')
          old_doc = """- erst wenn globale Shell und aktive Routen entkoppelt sind, wird `design-system.css` aus dem globalen Enqueue genommen.\n"""
          new_doc = """- `design-system.css` ist auf der kanonischen Startseite und der Personenseite bereits aus dem Enqueue genommen; weitere Routen folgen erst nach eigenem Provider-Audit.\n"""
          if d.count(old_doc) != 1:
              raise SystemExit(f'doc rule anchor count: {d.count(old_doc)}')
          d = d.replace(old_doc, new_doc)

          old_cluster = """1. **Globale Shell:** `site-header.css` und `style.css` sind von `--nx-*` entkoppelt. Der nächste Schritt ist ein separater Audit der noch global konsumierten, nicht-NX-benannten Rollen und generischen Regeln aus `design-system.css`; erst danach darf der Legacy-Provider bedingt geladen werden.\n"""
          new_cluster = """1. **Globale Shell / Provider:** `site-header.css` und `style.css` sind von `--nx-*` entkoppelt. `design-system.css` wird auf der kanonischen Startseite und der Personenseite nicht mehr geladen. Auf allen übrigen Routen bleibt der Provider vorerst aktiv, weil er neben NX-Tokens auch unpräfixierte Tokens sowie globale `body`-/Heading-/Kompatibilitätsregeln bereitstellt.\n"""
          if d.count(old_cluster) != 1:
              raise SystemExit(f'doc cluster anchor count: {d.count(old_cluster)}')
          d = d.replace(old_cluster, new_cluster)

          old_order = """1. **Globale Shell (NX erledigt):** Audit-Header und `style.css` sind von `--nx-*` entkoppelt. Als Nächstes werden die noch global wirkenden, nicht-NX-benannten Provider-Rollen und generischen Regeln auditiert; erst dann wird `design-system.css` aus dem globalen Enqueue genommen oder bedingt geladen.\n"""
          new_order = """1. **Globale Shell (NX erledigt):** Audit-Header und `style.css` sind von `--nx-*` entkoppelt. Der Provider-Audit hat unpräfixierte Legacy-Tokens und globale Selektorwirkungen bestätigt; deshalb ist `design-system.css` zunächst nur auf Startseite und Personenseite abgeschaltet. Weitere Routen werden einzeln entkoppelt.\n"""
          if d.count(old_order) != 1:
              raise SystemExit(f'doc order anchor count: {d.count(old_order)}')
          docs.write_text(d.replace(old_order, new_order), encoding='utf-8')
          PY

      - name: Validate architecture and PHP
        run: |
          python3 scripts/audit-css-architecture.py
          python3 scripts/audit-legacy-nx-css.py
          php -l blocksy-child/inc/enqueue.php
          git diff --check

      - name: Show product diff
        run: git diff -- blocksy-child/inc/enqueue.php docs/architecture/CSS_ARCHITECTURE.md

      - name: Commit product migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocksy-child/inc/enqueue.php docs/architecture/CSS_ARCHITECTURE.md
          git diff --cached --quiet && exit 1
          git commit -m 'Conditionalize legacy design system on canonical routes'
          git push origin HEAD:${GITHUB_REF_NAME}
